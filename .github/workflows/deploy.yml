name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Avisa a Bing, Yandex y otros buscadores (IndexNow) que el sitio cambió.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping IndexNow
        run: |
          sleep 30
          URLS=$(curl -s https://flopezmiranda.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          echo "$URLS"
          curl -s -o /dev/null -w "%{http_code}\n" -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"flopezmiranda.com\",\"key\":\"f83bf2ae8c32414db7a79e68245eedf2\",\"keyLocation\":\"https://flopezmiranda.com/f83bf2ae8c32414db7a79e68245eedf2.txt\",\"urlList\":$URLS}"
